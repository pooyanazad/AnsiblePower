name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: test_unit.py
            name: Unit Tests (UT)
            live: false
          - suite: test_quality.py
            name: Quality Tests (QT)
            live: false
          - suite: test_smoke.py
            name: Smoke Tests (ST)
            live: false
          - suite: test_live_app.py
            name: Live App Tests (LAT)
            live: true

    name: ${{ matrix.name }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Flask app in background
      if: matrix.live
      run: |
        python ansiblePower.py &
        echo $! > flask.pid

    - name: Wait for Flask to be ready
      if: matrix.live
      run: |
        for i in $(seq 1 15); do
          curl -sf http://localhost:5000/ && echo "Flask is up!" && exit 0
          echo "Waiting... ($i)"
          sleep 2
        done
        echo "Flask did not start in time" && exit 1

    - name: Run tests
      run: |
        pytest tests/${{ matrix.suite }} -v

    - name: Stop Flask app
      if: matrix.live && always()
      run: |
        if [ -f flask.pid ]; then kill $(cat flask.pid) || true; fi

  release:
    needs: test
    runs-on: ubuntu-latest
    name: Create Release

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate version format
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "Invalid version format: $VERSION"
          echo "   Expected: v1.0, v2.1, v1.0.3, etc."
          exit 1
        fi
        echo "Version $VERSION is valid"

    - name: Check tag does not already exist
      run: |
        if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
          echo "Tag ${{ github.event.inputs.version }} already exists!"
          exit 1
        fi
        echo "Tag ${{ github.event.inputs.version }} is available"

    - name: Find previous release tag
      id: prev_tag
      run: |
        PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$PREV" ]; then
          echo "No previous tag found, will include entire history"
          echo "range=" >> "$GITHUB_OUTPUT"
        else
          echo "Previous tag: $PREV"
          echo "range=${PREV}..HEAD" >> "$GITHUB_OUTPUT"
        fi

    - name: Generate release notes and create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ github.event.inputs.version }}"
        RANGE="${{ steps.prev_tag.outputs.range }}"
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

        # Collect commits (full subject line)
        if [ -z "$RANGE" ]; then
          COMMITS=$(git log --pretty=format:"%s" --reverse)
        else
          COMMITS=$(git log --pretty=format:"%s" --reverse "$RANGE")
        fi

        # Category buckets and counters
        FEAT=""
        FIX=""
        REFACTOR=""
        TEST=""
        DOCS=""
        MAINT=""
        FEAT_COUNT=0
        FIX_COUNT=0
        REFACTOR_COUNT=0
        TEST_COUNT=0
        DOCS_COUNT=0
        MAINT_COUNT=0

        while IFS= read -r msg; do
          [ -z "$msg" ] && continue

          # Strip conventional-commit prefix and optional scope
          clean=$(echo "$msg" | sed -E 's/^[a-z]+(\([^)]*\))?: *//')

          # Capitalise first letter
          clean="$(echo "${clean:0:1}" | tr '[:lower:]' '[:upper:]')${clean:1}"

          case "$msg" in
            feat:*|feat\(*)
              FEAT="${FEAT}- ${clean}"$'\n'
              FEAT_COUNT=$((FEAT_COUNT + 1))
              ;;
            fix:*|fix\(*)
              FIX="${FIX}- ${clean}"$'\n'
              FIX_COUNT=$((FIX_COUNT + 1))
              ;;
            refactor:*|refactor\(*)
              REFACTOR="${REFACTOR}- ${clean}"$'\n'
              REFACTOR_COUNT=$((REFACTOR_COUNT + 1))
              ;;
            test:*|test\(*)
              TEST="${TEST}- ${clean}"$'\n'
              TEST_COUNT=$((TEST_COUNT + 1))
              ;;
            docs:*|doc:*)
              DOCS="${DOCS}- ${clean}"$'\n'
              DOCS_COUNT=$((DOCS_COUNT + 1))
              ;;
            ci:*|ci\(*|chore:*|chore\(*)
              MAINT="${MAINT}- ${clean}"$'\n'
              MAINT_COUNT=$((MAINT_COUNT + 1))
              ;;
            *)
              MAINT="${MAINT}- ${clean}"$'\n'
              MAINT_COUNT=$((MAINT_COUNT + 1))
              ;;
          esac
        done <<< "$COMMITS"

        # --- Build a human-readable release title ---
        TITLE_PARTS=""
        [ "$FEAT_COUNT" -gt 0 ]     && TITLE_PARTS="${TITLE_PARTS}Features, "
        [ "$FIX_COUNT" -gt 0 ]      && TITLE_PARTS="${TITLE_PARTS}Bug Fixes, "
        [ "$REFACTOR_COUNT" -gt 0 ] && TITLE_PARTS="${TITLE_PARTS}Refactoring, "
        [ "$TEST_COUNT" -gt 0 ]     && TITLE_PARTS="${TITLE_PARTS}Testing, "
        [ "$DOCS_COUNT" -gt 0 ]     && TITLE_PARTS="${TITLE_PARTS}Documentation, "
        [ "$MAINT_COUNT" -gt 0 ]    && TITLE_PARTS="${TITLE_PARTS}Maintenance, "

        # Remove trailing ", " and replace last ", " with " & "
        TITLE_PARTS=$(echo "$TITLE_PARTS" | sed 's/, $//')
        TITLE_PARTS=$(echo "$TITLE_PARTS" | sed 's/\(.*\), /\1 \& /')

        if [ -n "$TITLE_PARTS" ]; then
          RELEASE_TITLE="${VERSION}: ${TITLE_PARTS}"
        else
          RELEASE_TITLE="${VERSION}"
        fi

        # Truncate if too long
        if [ ${#RELEASE_TITLE} -gt 80 ]; then
          RELEASE_TITLE="${RELEASE_TITLE:0:77}..."
        fi

        echo "Release title: $RELEASE_TITLE"

        # --- Build release body ---
        TOTAL=$((FEAT_COUNT + FIX_COUNT + REFACTOR_COUNT + TEST_COUNT + DOCS_COUNT + MAINT_COUNT))

        BODY="We're happy to ship **AnsiblePower ${VERSION}**! "
        BODY="${BODY}This release includes **${TOTAL} changes** since ${PREV_TAG}."$'\n\n'
        BODY="${BODY}---"$'\n\n'
        BODY="${BODY}## What's New in ${VERSION}"$'\n\n'

        [ -n "$FEAT" ]     && BODY="${BODY}### 🚀 New Features"$'\n\n'"${FEAT}"$'\n'
        [ -n "$FIX" ]      && BODY="${BODY}### 🐛 Bug Fixes"$'\n\n'"${FIX}"$'\n'
        [ -n "$REFACTOR" ] && BODY="${BODY}### ♻️ Refactoring"$'\n\n'"${REFACTOR}"$'\n'
        [ -n "$TEST" ]     && BODY="${BODY}### 🧪 Testing"$'\n\n'"${TEST}"$'\n'
        [ -n "$DOCS" ]     && BODY="${BODY}### 📝 Documentation"$'\n\n'"${DOCS}"$'\n'
        [ -n "$MAINT" ]    && BODY="${BODY}### 🔧 Maintenance"$'\n\n'"${MAINT}"$'\n'

        # Add comparison link when previous tag exists
        if [ "$PREV_TAG" != "none" ]; then
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          BODY="${BODY}---"$'\n\n'
          BODY="${BODY}**Full changelog**: [${PREV_TAG}...${VERSION}](${REPO_URL}/compare/${PREV_TAG}...${VERSION})"$'\n'
        fi

        # Write notes to file
        echo "$BODY" > release_notes.md
        echo "Generated release notes:"
        cat release_notes.md

        # Create the release
        gh release create "$VERSION" \
          --title "$RELEASE_TITLE" \
          --notes-file release_notes.md \
          --target main
