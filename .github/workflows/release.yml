name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/test_unit.py -v --tb=short \
            --junitxml=reports/unit-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rel-unit-report
          path: reports/unit-results.xml
          retention-days: 30

  quality-tests:
    name: Quality Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run quality tests
        run: |
          mkdir -p reports
          pytest tests/test_quality.py -v --tb=short \
            --junitxml=reports/quality-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rel-quality-report
          path: reports/quality-results.xml
          retention-days: 30

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run smoke tests
        run: |
          mkdir -p reports
          pytest tests/test_smoke.py -v --tb=short \
            --junitxml=reports/smoke-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rel-smoke-report
          path: reports/smoke-results.xml
          retention-days: 30

  live-tests:
    name: Live App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start Flask app
        run: |
          python ansiblePower.py > /tmp/flask.log 2>&1 &
          echo $! > flask.pid
      - name: Wait for Flask
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/flask.log; exit 1
      - name: Run live app tests
        run: |
          mkdir -p reports
          pytest tests/test_live_app.py -v --tb=short \
            --junitxml=reports/live-results.xml
      - name: Stop Flask app
        if: always()
        run: |
          if [ -f flask.pid ]; then kill $(cat flask.pid) || true; fi
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rel-live-report
          path: reports/live-results.xml
          retention-days: 30

  # ── One clean summary table; fails if any suite failed (blocks release) ────
  test-summary:
    name: Test Results
    runs-on: ubuntu-latest
    needs: [unit-tests, quality-tests, smoke-tests, live-tests]
    if: always()
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
        continue-on-error: true

      - name: Write summary table
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, glob, sys

          sp = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")

          suites = [
              ("unit",    "Unit Tests"),
              ("quality", "Quality Tests"),
              ("smoke",   "Smoke Tests"),
              ("live",    "Live App Tests"),
          ]

          rows = []
          grand = dict(t=0, p=0, f=0, e=0, s=0, d=0.0)
          any_fail = False

          for key, label in suites:
              xmls = glob.glob(f"reports/**/{key}-results.xml", recursive=True)
              if not xmls:
                  rows.append(f"| {label} | ⚠️ — | — | — | — | — | — |")
                  any_fail = True
                  continue
              try:
                  root = ET.parse(xmls[0]).getroot()
                  if root.tag == "testsuites":
                      root = root[0]
                  t  = int(root.get("tests",    0))
                  f  = int(root.get("failures",  0))
                  e  = int(root.get("errors",    0))
                  sk = int(root.get("skipped",   0))
                  p  = t - f - e - sk
                  d  = float(root.get("time",    0))
                  st = "✅" if (f + e) == 0 else "❌"
                  if (f + e): any_fail = True
                  rows.append(f"| {label} | {st} | {t} | {p} | {f} | {e} | {d:.1f}s |")
                  grand["t"] += t; grand["p"] += p; grand["f"] += f
                  grand["e"] += e; grand["s"] += sk; grand["d"] += d
              except Exception as ex:
                  rows.append(f"| {label} | ⚠️ parse error | — | — | — | — | — |")
                  any_fail = True

          ok = not any_fail
          badge = "✅ All passed — ready to release" if ok else "❌ Some failed — release blocked"

          with open(sp, "a") as out:
              out.write(f"# Pre-Release Test Results — {badge}\n\n")
              out.write("| Suite | Result | Total | Passed | Failed | Errors | Time |\n")
              out.write("|---|:---:|---:|---:|---:|---:|---:|\n")
              for r in rows:
                  out.write(r + "\n")
              out.write(f"| **Total** | {'✅' if ok else '❌'} | **{grand['t']}** | **{grand['p']}** | **{grand['f']}** | **{grand['e']}** | **{grand['d']:.1f}s** |\n")

          if any_fail:
              sys.exit(1)
          EOF

  # ── Only runs when all tests pass ─────────────────────────────────────────
  release:
    name: Create Release
    needs: test-summary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION"; exit 1
          fi
          echo "Version $VERSION is valid"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "${{ github.event.inputs.version }}" > /dev/null 2>&1; then
            echo "Tag ${{ github.event.inputs.version }} already exists!"; exit 1
          fi

      - name: Find previous release tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then echo "range=" >> "$GITHUB_OUTPUT"
          else echo "range=${PREV}..HEAD" >> "$GITHUB_OUTPUT"; fi

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
        continue-on-error: true

      - name: Write test-table helper script
        run: |
          cat > /tmp/gentable.py << 'ENDSCRIPT'
          import xml.etree.ElementTree as ET, glob
          suites = [("unit","Unit Tests"),("quality","Quality Tests"),("smoke","Smoke Tests"),("live","Live Tests")]
          lines = ["## Pre-Release Test Results\n","| Suite | Result | Total | Passed | Failed | Errors | Time |","|---|:---:|---:|---:|---:|---:|---:|"]
          gt=gp=gf=ge=0; gd=0.0
          for key, label in suites:
              xmls = glob.glob(f"reports/**/{key}-results.xml", recursive=True)
              if not xmls:
                  lines.append(f"| {label} | n/a | - | - | - | - | - |"); continue
              try:
                  root = ET.parse(xmls[0]).getroot()
                  if root.tag == "testsuites": root = root[0]
                  t=int(root.get("tests",0)); f=int(root.get("failures",0))
                  e=int(root.get("errors",0)); s=int(root.get("skipped",0))
                  p=t-f-e-s; d=float(root.get("time",0))
                  st="PASS" if (f+e)==0 else "FAIL"
                  lines.append(f"| {label} | {st} | {t} | {p} | {f} | {e} | {d:.1f}s |")
                  gt+=t; gp+=p; gf+=f; ge+=e; gd+=d
              except: lines.append(f"| {label} | error | - | - | - | - | - |")
          ok="PASS" if (gf+ge)==0 else "FAIL"
          lines.append(f"| **Total** | {ok} | **{gt}** | **{gp}** | **{gf}** | **{ge}** | **{gd:.1f}s** |")
          with open("/tmp/test_table.md","w") as out: out.write("\n".join(lines)+"\n")
          ENDSCRIPT
          python3 /tmp/gentable.py

      - name: Generate release notes and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          RANGE="${{ steps.prev_tag.outputs.range }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          if [ -z "$RANGE" ]; then COMMITS=$(git log --pretty=format:"%s" --reverse)
          else COMMITS=$(git log --pretty=format:"%s" --reverse "$RANGE"); fi

          FEAT="" FIX="" REFACTOR="" TEST="" DOCS="" MAINT=""
          FEAT_C=0 FIX_C=0 REF_C=0 TEST_C=0 DOCS_C=0 MAINT_C=0

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            clean=$(echo "$msg" | sed -E 's/^[a-z]+(\([^)]*\))?: *//')
            clean="$(echo "${clean:0:1}" | tr '[:lower:]' '[:upper:]')${clean:1}"
            case "$msg" in
              feat:*|feat\(*)    FEAT="${FEAT}- ${clean}"$'\n'; FEAT_C=$((FEAT_C+1)) ;;
              fix:*|fix\(*)      FIX="${FIX}- ${clean}"$'\n';   FIX_C=$((FIX_C+1))  ;;
              refactor:*|refactor\(*) REFACTOR="${REFACTOR}- ${clean}"$'\n'; REF_C=$((REF_C+1)) ;;
              test:*|test\(*)    TEST="${TEST}- ${clean}"$'\n';  TEST_C=$((TEST_C+1)) ;;
              docs:*|doc:*)      DOCS="${DOCS}- ${clean}"$'\n';  DOCS_C=$((DOCS_C+1)) ;;
              *)                 MAINT="${MAINT}- ${clean}"$'\n'; MAINT_C=$((MAINT_C+1)) ;;
            esac
          done <<< "$COMMITS"

          TP=""
          [ "$FEAT_C"  -gt 0 ] && TP="${TP}Features, "
          [ "$FIX_C"   -gt 0 ] && TP="${TP}Bug Fixes, "
          [ "$REF_C"   -gt 0 ] && TP="${TP}Refactoring, "
          [ "$TEST_C"  -gt 0 ] && TP="${TP}Testing, "
          [ "$DOCS_C"  -gt 0 ] && TP="${TP}Documentation, "
          [ "$MAINT_C" -gt 0 ] && TP="${TP}Maintenance, "
          TP=$(echo "$TP" | sed 's/, $//' | sed 's/\(.*\), /\1 \& /')
          TITLE="${VERSION}${TP:+: $TP}"
          [ ${#TITLE} -gt 80 ] && TITLE="${TITLE:0:77}..."

          TOTAL=$((FEAT_C+FIX_C+REF_C+TEST_C+DOCS_C+MAINT_C))
          B="We're happy to ship **AnsiblePower ${VERSION}**! "
          B="${B}This release includes **${TOTAL} changes** since ${PREV_TAG}."$'\n\n---\n\n'
          B="${B}## What's New in ${VERSION}"$'\n\n'
          [ -n "$FEAT"     ] && B="${B}### New Features"$'\n\n'"${FEAT}"$'\n'
          [ -n "$FIX"      ] && B="${B}### Bug Fixes"$'\n\n'"${FIX}"$'\n'
          [ -n "$REFACTOR" ] && B="${B}### Refactoring"$'\n\n'"${REFACTOR}"$'\n'
          [ -n "$TEST"     ] && B="${B}### Testing"$'\n\n'"${TEST}"$'\n'
          [ -n "$DOCS"     ] && B="${B}### Documentation"$'\n\n'"${DOCS}"$'\n'
          [ -n "$MAINT"    ] && B="${B}### Maintenance"$'\n\n'"${MAINT}"$'\n'

          # Build test table (script written by prior step)

          B="${B}"$'\n---\n\n'
          B="${B}$(cat /tmp/test_table.md)"$'\n'

          if [ "$PREV_TAG" != "none" ]; then
            REPO="${{ github.server_url }}/${{ github.repository }}"
            B="${B}"$'\n---\n\n'
            B="${B}**Full changelog**: [${PREV_TAG}...${VERSION}](${REPO}/compare/${PREV_TAG}...${VERSION})"$'\n'
          fi

          echo "$B" > release_notes.md
          gh release create "$VERSION" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --target main

          echo "## Released $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View on GitHub](${{ github.server_url }}/${{ github.repository }}/releases/tag/${VERSION})" >> "$GITHUB_STEP_SUMMARY"
