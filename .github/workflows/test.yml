name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/test_unit.py -v --tb=short \
            --junitxml=reports/unit-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: reports/unit-results.xml
          retention-days: 7

  quality-tests:
    name: Quality Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run quality tests
        run: |
          mkdir -p reports
          pytest tests/test_quality.py -v --tb=short \
            --junitxml=reports/quality-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality-results.xml
          retention-days: 7

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run smoke tests
        run: |
          mkdir -p reports
          pytest tests/test_smoke.py -v --tb=short \
            --junitxml=reports/smoke-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/smoke-results.xml
          retention-days: 7

  live-tests:
    name: Live App Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start Flask app
        run: |
          python ansiblePower.py > /tmp/flask.log 2>&1 &
          echo $! > flask.pid
      - name: Wait for Flask
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/flask.log; exit 1
      - name: Run live app tests
        run: |
          mkdir -p reports
          pytest tests/test_live_app.py -v --tb=short \
            --junitxml=reports/live-results.xml
      - name: Stop Flask app
        if: always()
        run: |
          if [ -f flask.pid ]; then kill $(cat flask.pid) || true; fi
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: reports/live-results.xml
          retention-days: 7

  # ── One clean summary table, nothing else ──────────────────────────────────
  summary:
    name: Test Results
    runs-on: ubuntu-latest
    needs: [unit-tests, quality-tests, smoke-tests, live-tests]
    if: always()
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
        continue-on-error: true

      - name: Write summary table
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, glob

          sp = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")

          suites = [
              ("unit",    "Unit Tests"),
              ("quality", "Quality Tests"),
              ("smoke",   "Smoke Tests"),
              ("live",    "Live App Tests"),
          ]

          rows = []
          grand = dict(t=0, p=0, f=0, e=0, s=0, d=0.0)

          for key, label in suites:
              xmls = glob.glob(f"reports/**/{key}-results.xml", recursive=True)
              if not xmls:
                  rows.append(f"| {label} | ⚠️ — | — | — | — | — | — |")
                  continue
              try:
                  root = ET.parse(xmls[0]).getroot()
                  if root.tag == "testsuites":
                      root = root[0]
                  t  = int(root.get("tests",    0))
                  f  = int(root.get("failures",  0))
                  e  = int(root.get("errors",    0))
                  sk = int(root.get("skipped",   0))
                  p  = t - f - e - sk
                  d  = float(root.get("time",    0))
                  st = "✅" if (f + e) == 0 else "❌"
                  rows.append(f"| {label} | {st} | {t} | {p} | {f} | {e} | {d:.1f}s |")
                  grand["t"] += t; grand["p"] += p; grand["f"] += f
                  grand["e"] += e; grand["s"] += sk; grand["d"] += d
              except Exception as ex:
                  rows.append(f"| {label} | ⚠️ parse error | — | — | — | — | — |")

          ok = grand["f"] + grand["e"] == 0
          badge = "✅ All passed" if ok else "❌ Some failed"

          with open(sp, "a") as out:
              out.write(f"# Test Results — {badge}\n\n")
              out.write("| Suite | Result | Total | Passed | Failed | Errors | Time |\n")
              out.write("|---|:---:|---:|---:|---:|---:|---:|\n")
              for r in rows:
                  out.write(r + "\n")
              out.write(f"| **Total** | {'✅' if ok else '❌'} | **{grand['t']}** | **{grand['p']}** | **{grand['f']}** | **{grand['e']}** | **{grand['d']:.1f}s** |\n")
          EOF