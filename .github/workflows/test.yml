name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/test_unit.py tests/test_auth.py tests/test_inventory_security.py tests/test_jobs.py tests/test_ci_summary.py -v --tb=short \
            --junitxml=reports/unit-results.xml \
            --cov=ansiblePower --cov-report=term-missing \
            --cov-fail-under=40
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: reports/unit-results.xml
          retention-days: 7

  quality-tests:
    name: Quality Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run quality tests
        run: |
          mkdir -p reports
          pytest tests/test_quality.py -v --tb=short \
            --junitxml=reports/quality-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/quality-results.xml
          retention-days: 7

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run smoke tests
        run: |
          mkdir -p reports
          pytest tests/test_smoke.py -v --tb=short \
            --junitxml=reports/smoke-results.xml \
            --cov=ansiblePower --cov-report=term-missing
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/smoke-results.xml
          retention-days: 7

  live-tests:
    name: Live App Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run live app tests
        run: |
          mkdir -p reports
          pytest tests/test_live_app.py tests/test_worker_lifecycle.py -v --tb=short \
            --junitxml=reports/live-results.xml
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report
          path: reports/live-results.xml
          retention-days: 7

  # ── One clean summary table, nothing else ──────────────────────────────────
  summary:
    name: Test Results
    runs-on: ubuntu-24.04
    needs: [unit-tests, quality-tests, smoke-tests, live-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
        continue-on-error: true

      - name: Write summary table
        env:
          TEST_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/summarize_tests.py
