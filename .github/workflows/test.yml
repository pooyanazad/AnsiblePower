name: 🧪 Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 🔬 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🔬 Run unit tests
        run: |
          pytest tests/test_unit.py \
            -v \
            --tb=short \
            --junitxml=reports/unit-results.xml \
            --cov=ansiblePower \
            --cov-report=term-missing \
            --cov-report=xml:reports/unit-coverage.xml \
            2>&1 | tee reports/unit-output.txt
        continue-on-error: false

      - name: 📊 Write step summary
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, sys

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          try:
              tree = ET.parse("reports/unit-results.xml")
              suite = tree.getroot()
              if suite.tag == "testsuites":
                  suite = suite[0]
              tests   = int(suite.get("tests",   0))
              failed  = int(suite.get("failures", 0))
              errors  = int(suite.get("errors",   0))
              skipped = int(suite.get("skipped",  0))
              passed  = tests - failed - errors - skipped
              duration = float(suite.get("time", 0))
              status  = "✅ Passed" if (failed + errors) == 0 else "❌ Failed"
          except Exception as e:
              tests = passed = failed = errors = skipped = 0
              duration = 0.0
              status = f"⚠️ Parse error: {e}"

          with open(summary, "a") as f:
              f.write("## 🔬 Unit Tests\n\n")
              f.write(f"**Result: {status}**\n\n")
              f.write("| Metric | Count |\n|---|---|\n")
              f.write(f"| ✅ Passed  | {passed}  |\n")
              f.write(f"| ❌ Failed  | {failed}  |\n")
              f.write(f"| 🔴 Errors  | {errors}  |\n")
              f.write(f"| ⏭️ Skipped | {skipped} |\n")
              f.write(f"| 🕐 Duration | {duration:.2f}s |\n\n")

              if failed + errors:
                  f.write("### ❌ Failures\n\n")
                  for tc in suite.iter("testcase"):
                      for child in tc:
                          if child.tag in ("failure", "error"):
                              f.write(f"- **{tc.get('classname')}.{tc.get('name')}**\n")
                              f.write(f"  ```\n  {child.text.strip()[:500] if child.text else ''}\n  ```\n")
          EOF

      - name: 📁 Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/
          retention-days: 14

