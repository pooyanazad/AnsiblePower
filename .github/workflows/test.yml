  # ─────────────────────────────────────────────────────────────────────────────
  # Live App Tests
  # ─────────────────────────────────────────────────────────────────────────────
  live-tests:
    name: 🌐 Live App Tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🚀 Start Flask app
        run: |
          mkdir -p reports
          python ansiblePower.py > reports/flask.log 2>&1 &
          echo $! > flask.pid

      - name: ⏳ Wait for Flask to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Flask is up after ${i} attempt(s)"
              exit 0
            fi
            echo "⏳ Waiting... attempt $i/15"
            sleep 2
          done
          echo "❌ Flask did not start in time"
          cat reports/flask.log
          exit 1

      - name: 🌐 Run live app tests
        run: |
          pytest tests/test_live_app.py \
            -v \
            --tb=short \
            --junitxml=reports/live-results.xml \
            2>&1 | tee reports/live-output.txt

      - name: 📊 Write step summary
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          try:
              tree = ET.parse("reports/live-results.xml")
              suite = tree.getroot()
              if suite.tag == "testsuites":
                  suite = suite[0]
              tests   = int(suite.get("tests",   0))
              failed  = int(suite.get("failures", 0))
              errors  = int(suite.get("errors",   0))
              skipped = int(suite.get("skipped",  0))
              passed  = tests - failed - errors - skipped
              duration = float(suite.get("time", 0))
              status  = "✅ Passed" if (failed + errors) == 0 else "❌ Failed"
          except Exception as e:
              tests = passed = failed = errors = skipped = 0
              duration = 0.0
              status = f"⚠️ Parse error: {e}"

          with open(summary, "a") as f:
              f.write("## 🌐 Live App Tests\n\n")
              f.write(f"**Result: {status}**\n\n")
              f.write("| Metric | Count |\n|---|---|\n")
              f.write(f"| ✅ Passed  | {passed}  |\n")
              f.write(f"| ❌ Failed  | {failed}  |\n")
              f.write(f"| 🔴 Errors  | {errors}  |\n")
              f.write(f"| ⏭️ Skipped | {skipped} |\n")
              f.write(f"| 🕐 Duration | {duration:.2f}s |\n\n")

              if failed + errors:
                  f.write("### ❌ Failures\n\n")
                  for tc in suite.iter("testcase"):
                      for child in tc:
                          if child.tag in ("failure", "error"):
                              f.write(f"- **{tc.get('classname')}.{tc.get('name')}**\n")
                              f.write(f"  ```\n  {child.text.strip()[:500] if child.text else ''}\n  ```\n")
          EOF

      - name: 🛑 Stop Flask app
        if: always()
        run: |
          if [ -f flask.pid ]; then kill $(cat flask.pid) || true; fi

      - name: 📁 Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-report
          path: reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Final Summary — runs after all test jobs (pass or fail)
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, quality-tests, smoke-tests, live-tests]
    if: always()

    steps:
      - name: ⬇️ Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
        continue-on-error: true

      - name: 📋 Write overall summary
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, glob

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")

          labels = {
              "unit":    ("🔬", "Unit Tests"),
              "quality": ("🏆", "Quality Tests"),
              "smoke":   ("💨", "Smoke Tests"),
              "live":    ("🌐", "Live App Tests"),
          }

          totals = {"tests": 0, "passed": 0, "failed": 0, "errors": 0, "skipped": 0, "duration": 0.0}
          rows = []

          for key, (icon, label) in labels.items():
              xml_files = glob.glob(f"all-reports/**/{key}-results.xml", recursive=True)
              if not xml_files:
                  rows.append((icon, label, "⚠️ No report", "-", "-", "-", "-", "-"))
                  continue
              try:
                  tree = ET.parse(xml_files[0])
                  suite = tree.getroot()
                  if suite.tag == "testsuites":
                      suite = suite[0]
                  t = int(suite.get("tests",   0))
                  f = int(suite.get("failures", 0))
                  e = int(suite.get("errors",   0))
                  s = int(suite.get("skipped",  0))
                  p = t - f - e - s
                  d = float(suite.get("time", 0))
                  status = "✅ Pass" if (f + e) == 0 else "❌ Fail"
                  rows.append((icon, label, status, t, p, f, e, d))
                  totals["tests"]    += t
                  totals["passed"]   += p
                  totals["failed"]   += f
                  totals["errors"]   += e
                  totals["skipped"]  += s
                  totals["duration"] += d
              except Exception as ex:
                  rows.append((icon, label, f"⚠️ Error: {ex}", "-", "-", "-", "-", "-"))

          overall = "✅ All Passed" if totals["failed"] + totals["errors"] == 0 else "❌ Some Failed"

          with open(summary_path, "a") as f:
              f.write("# 📋 AnsiblePower — Test Suite Summary\n\n")
              f.write(f"**Overall: {overall}**\n\n")
              f.write("| Suite | Result | Total | ✅ Passed | ❌ Failed | 🔴 Errors | ⏱ Time |\n")
              f.write("|---|---|---|---|---|---|---|\n")
              for row in rows:
                  icon, label, status, t, p, fl, e, d = row
                  time_str = f"{d:.1f}s" if isinstance(d, float) else d
                  f.write(f"| {icon} {label} | {status} | {t} | {p} | {fl} | {e} | {time_str} |\n")
              f.write(f"\n**Totals** — {totals['tests']} tests · {totals['passed']} passed · {totals['failed']} failed · {totals['errors']} errors · {totals['duration']:.1f}s\n")
          EOF