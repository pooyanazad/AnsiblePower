              if failed + errors:
                  f.write("### ❌ Failures\n\n")
                  for tc in suite.iter("testcase"):
                      for child in tc:
                          if child.tag in ("failure", "error"):
                              f.write(f"- **{tc.get('classname')}.{tc.get('name')}**\n")
