services:
  ansiblepower:
    build: .
    image: ansiblepower:latest
    container_name: ansiblepower
    ports:
      - "5000:5000"
    volumes:
      - ./playbooks:/app/playbooks
      - ./data:/app/data
      - ./logs:/app/logs
      - ~/.ssh:/home/appuser/.ssh:ro
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - ANSIBLE_PLAYBOOK_BIN=${ANSIBLE_PLAYBOOK_BIN:-ansible-playbook}
      - ANSIBLEPOWER_RUN_CONCURRENCY=${ANSIBLEPOWER_RUN_CONCURRENCY:-1}
      - ANSIBLEPOWER_RUN_TIMEOUT=${ANSIBLEPOWER_RUN_TIMEOUT:-300}
    restart: unless-stopped
