[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/ansiblepower-supervisord.pid

[program:web]
command=gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 ansiblePower:app
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:runner]
command=python worker.py
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=310
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
