{% from 'partials/_icons.html' import icon, sprite %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}ansible-power{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233b82f6' d='M13 2 4 14h7l-1 8 10-13h-7z'/></svg>">
    {% include 'partials/_theme.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    {{ sprite() }}
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div class="app-shell">
        {% include 'partials/_header.html' %}
        {% include 'partials/_sidebar.html' %}
        <main id="main-content" role="main" class="workspace" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
