<header class="app-header">
    <a class="brand" href="{{ url_for('main.homepage') }}">
        <span class="brand-mark">{{ icon('bolt') }}</span>
        <span>ansible-power</span>
    </a>
    <div class="header-actions">
        <button type="button" id="toggle-dark-mode" class="btn btn-quiet">
            <span class="theme-moon">{{ icon('moon') }}</span>
            <span class="theme-sun">{{ icon('sun') }}</span>
            <span id="dark-mode-label">Dark mode</span>
        </button>
        <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-quiet">{{ icon('exit') }} Sign out</button>
        </form>
    </div>
</header>
